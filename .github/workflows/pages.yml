name: Haxe checks and demo deployment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flixel-ux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.6'

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y neko openjdk-17-jre-headless

      - name: Install Haxelibs
        run: |
          haxelib setup "${HOME}/haxelib"
          haxelib install flixel 6.1.2
          haxelib install openfl
          haxelib install lime
          haxelib install actuate
          haxelib install formatter 1.18.0
          haxelib dev flixel-ux "${GITHUB_WORKSPACE}"

      - name: Check formatting
        run: haxelib run formatter --check -s src -s tests/TestMain.hx

      - name: Run tests
        working-directory: tests
        run: haxelib run lime test neko -debug

      - name: Build demo (HTML5)
        working-directory: demo
        run: haxelib run lime build html5 -release -final -clean

      - name: Upload demo build artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-html5
          path: demo/export/html5/bin/
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Download demo build artifact
        uses: actions/download-artifact@v4
        with:
          name: demo-html5
          path: _site

      - name: Prepare Pages artifact
        run: touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
